name: Luna CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      
      - name: Setup google-services.json
        run: |
          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
            echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 -d > app/google-services.json
          else
            echo '{"project_info":{"project_number":"123456789012","project_id":"luna-app","storage_bucket":"luna-app.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:123456789012:android:abcdef1234567890","android_client_info":{"package_name":"com.cynora.luna"}},"oauth_client":[],"api_key":[{"current_key":"dummy_key_for_ci"}],"services":{"analytics_service":{"status":1}}},{"client_info":{"mobilesdk_app_id":"1:123456789012:android:abcdef1234567891","android_client_info":{"package_name":"com.cynora.luna.debug"}},"oauth_client":[],"api_key":[{"current_key":"dummy_key_for_ci"}],"services":{"analytics_service":{"status":1}}}],"configuration_version":"1"}' > app/google-services.json
          fi
      
      - name: Run Lint
        run: ./gradlew lintDebug
      
      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest
      
      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/build/reports/tests/'
  
  build-debug:
    name: Build Debug APK
    needs: lint-and-test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      
      - name: Setup google-services.json
        run: |
          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
            echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 -d > app/google-services.json
          else
            echo '{"project_info":{"project_number":"123456789012","project_id":"luna-app","storage_bucket":"luna-app.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:123456789012:android:abcdef1234567890","android_client_info":{"package_name":"com.cynora.luna"}},"oauth_client":[],"api_key":[{"current_key":"dummy_key_for_ci"}],"services":{"analytics_service":{"status":1}}},{"client_info":{"mobilesdk_app_id":"1:123456789012:android:abcdef1234567891","android_client_info":{"package_name":"com.cynora.luna.debug"}},"oauth_client":[],"api_key":[{"current_key":"dummy_key_for_ci"}],"services":{"analytics_service":{"status":1}}}],"configuration_version":"1"}' > app/google-services.json
          fi
      
      - name: Build Debug APK
        run: ./gradlew assembleDebug
      
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
