name: Luna Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    name: Build & Release
    runs-on: ubuntu-latest
    
    steps:
      - name: Free Disk Space (Ubuntu)
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android/sdk/ndk/*
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          sudo docker image prune --all --force 2>/dev/null || true
          df -h

      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x gradlew
      
      - name: Decode google-services.json
        env:
          GSERVICES_DATA: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          python3 -c "
          import os, base64, json
          data = os.environ.get('GSERVICES_DATA', '').strip()
          try:
              decoded = base64.b64decode(data).decode('utf-8')
              json.loads(decoded)
              with open('app/google-services.json', 'w') as f:
                  f.write(decoded)
              print('Successfully decoded base64 google-services.json')
          except Exception:
              with open('app/google-services.json', 'w') as f:
                  f.write(data)
              print('Wrote plain text google-services.json')
          "
          ls -la app/google-services.json

      - name: Decode Keystore
        env:
          KEYSTORE_DATA: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          python3 -c "
          import os, base64
          data = os.environ.get('KEYSTORE_DATA', '').strip()
          with open('app/luna-release.jks', 'wb') as f:
              f.write(base64.b64decode(data))
          print('Successfully decoded keystore')
          "
          ls -la app/luna-release.jks
      
      - name: Extract Version
        id: version
        run: |
          if [[ $GITHUB_REF == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=1.0.0" >> $GITHUB_OUTPUT
          fi
      
      - name: Build Release AAB
        run: >
          ./gradlew bundleRelease
          -PLUNA_STORE_FILE="$LUNA_STORE_FILE"
          -PLUNA_STORE_PASSWORD="$LUNA_STORE_PASSWORD"
          -PLUNA_KEY_ALIAS="$LUNA_KEY_ALIAS"
          -PLUNA_KEY_PASSWORD="$LUNA_KEY_PASSWORD"
        env:
          LUNA_STORE_FILE: luna-release.jks
          LUNA_STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          LUNA_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          LUNA_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: app/build/outputs/bundle/release/app-release.aab
          name: Luna v${{ steps.version.outputs.VERSION }}
          body: |
            ## Luna v${{ steps.version.outputs.VERSION }}
            
            ### What's New
            - Google Sign-In & account sync
            - Premium tarot readings
            - Birth chart calculator
            - Zodiac compatibility
            - Angel numbers guide
            - Daily affirmations
            - Lucky numbers
            - Offline-first architecture
            
            ### Features
            - 8 reading types: coffee, tarot, lenormand, angel, horoscope, dream, palm, love
            - 288 hand-checked readings
            - AdMob monetization
            - Firebase backend
            - GDPR/KVKK compliant
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Upload to Play Console
        if: startsWith(github.ref, 'refs/tags/v') && env.HAVE_PLAY_KEY == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.cynora.luna
          releaseFiles: app/build/outputs/bundle/release/app-release.aab
          track: production
          status: completed
        env:
          HAVE_PLAY_KEY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
      
      - name: Notify Slack
        if: always() && env.HAVE_SLACK == 'true'
        uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: 'Luna v${{ steps.version.outputs.VERSION }} release pipeline finished with status: ${{ job.status }}'
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}
          HAVE_SLACK: ${{ secrets.SLACK_WEBHOOK != '' }}
